<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snack Love Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff4d8d;
      --rose: #ff7eb3;
      --cream: #fff8ef;
      --deep: #2e1c44;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Baloo 2", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #ffd7ea 0%, transparent 35%),
        radial-gradient(circle at 85% 20%, #ffe6b8 0%, transparent 30%),
        linear-gradient(135deg, #ffc7e3 0%, #ffd8a8 50%, #ffeecf 100%);
      color: var(--deep);
      overflow: hidden;
      padding: 16px;
    }

    .game-shell {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(126, 46, 80, 0.22);
      position: relative;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      flex-wrap: wrap;
    }

    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      border: 2px solid #ffd2e7;
      box-shadow: inset 0 -3px 0 rgba(255, 140, 181, 0.2);
    }

    .game-board {
      position: relative;
      width: 100%;
      height: min(66vh, 520px);
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid #ffd2e7;
      background:
        radial-gradient(circle at 20% 30%, #fff7cc 0 14%, transparent 15%),
        radial-gradient(circle at 75% 25%, #ffe0f0 0 15%, transparent 16%),
        linear-gradient(160deg, #fff9ef 0%, #fff1fb 100%);
    }

    .player,
    .food {
      position: absolute;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      user-select: none;
    }

    .player {
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.2));
      transition: transform 0.06s linear;
      z-index: 3;
    }

    .food {
      animation: bounce 0.8s infinite alternate ease-in-out;
      z-index: 2;
    }

    @keyframes bounce {
      from { transform: translateY(-2px) rotate(-8deg); }
      to { transform: translateY(3px) rotate(8deg); }
    }

    .win-overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 16px;
      background: rgba(255, 240, 248, 0.85);
      z-index: 5;
    }

    .win-overlay.active {
      display: grid;
      animation: fadeIn 0.45s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .win-card {
      background: #fff;
      border-radius: 24px;
      border: 3px solid #ffd2e7;
      padding: 24px;
      max-width: 560px;
      box-shadow: 0 15px 40px rgba(145, 54, 98, 0.24);
      z-index: 8;
    }

    .win-card h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--pink);
    }

    .win-card p {
      margin: 0 0 18px;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
      color: #d42172;
    }

    .restart {
      border: 0;
      background: linear-gradient(135deg, #ff64a3, #ff9a6d);
      color: white;
      font: inherit;
      font-weight: 800;
      border-radius: 14px;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255, 100, 163, 0.35);
    }

    .heart-rain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 6;
    }

    .heart {
      position: absolute;
      top: -8%;
      font-size: clamp(1rem, 3vw, 2rem);
      animation: drop linear forwards;
      opacity: 0.95;
    }

    @keyframes drop {
      to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }

    .ctrl {
      border: 2px solid #ffd2e7;
      background: #fff;
      border-radius: 12px;
      height: 52px;
      font: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      color: #d42172;
    }

    .empty {
      visibility: hidden;
    }

    @media (min-width: 760px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <div class="badge">Snack Count: <span id="score">0</span> / 10</div>
      <div class="badge">Goal: Eat 10 snacks to win</div>
    </section>

    <section class="game-board" id="board">
      <div class="player" id="player" aria-label="player">😋</div>
      <div class="food" id="food" aria-label="food">🍔</div>

      <div class="win-overlay" id="winOverlay">
        <div class="heart-rain" id="heartRain"></div>
        <div class="win-card">
          <h1>You Win</h1>
          <p>I love you mage Sankuttiye</p>
          <button class="restart" id="restartBtn" type="button">Play Again</button>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="mobile controls">
      <button class="ctrl empty" type="button">.</button>
      <button class="ctrl" type="button" data-move="up">▲</button>
      <button class="ctrl empty" type="button">.</button>
      <button class="ctrl" type="button" data-move="left">◀</button>
      <button class="ctrl" type="button" data-move="down">▼</button>
      <button class="ctrl" type="button" data-move="right">▶</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
